<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('Fetch setter patch failed:', e);
        }
        if (typeof window.global === 'undefined') {
          window.global = window;
        }
      })();
    </script>
